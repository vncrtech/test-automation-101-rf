version: v1.0
name: Initial Pipeline
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Build Web App
    dependencies: []
    task:
      jobs:
        - name: Setup Web Application
          commands:
            - 'docker run -d -p 8000:8000 vncrtech/puppybank'
  - name: Run Tests
    dependencies:
      - Build Web App
    skip:
      when: branch = 'master'
    task:
      jobs:
        - name: Test Suite
          commands:
            - echo "Running browser tests..."
          matrix:
            - env_var: Number
              values:
                - '1'
                - '2'
                - '3'
                - '4'
                - '5'
      prologue:
        commands:
          - checkout
promotions:
  - name: Promotion 1
    pipeline_file: pipeline_3.yml
