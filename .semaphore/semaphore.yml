version: v1.0
name: Initial Pipeline
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Install Dependencies
    dependencies: []
    task:
      jobs:
        - name: Checkout
          commands:
            - checkout
        - name: Docker Run
          commands:
            - 'docker run -d -p 8000:8000 vncrtech/puppybank'
        - name: Run Tests
          commands:
            - sudo apt-get update
            - sudo apt -y install python3.8-venv
            - python -m venv .venv
            - source .venv/bin/activate
            - pip install --upgrade robotframework-seleniumlibrary
            - $SEMAPHORE_GIT_DIR/.venv/bin/python -m robot.run --suite test-automation-101-rf.tests.smoke.login --outputdir $SEMAPHORE_GIT_DIR/results .
